site_name: Linkding for Mere Mortals
site_description: A bookmark manager you run yourself. Saving links with titles, descriptions and tags in one small database, searching them in plain words, importing and exporting the standard browser bookmarks file, sharing chosen links in public, and driving the whole thing from a REST API, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/linkding-for-mere-mortals/
